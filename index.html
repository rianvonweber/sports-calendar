<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F1117">
  <meta name="description" content="Personal sports & events schedule tracker">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Matchday">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Matchday</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app">

  <!-- ── Header ── -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        </div>
        <span class="logo-text">Match<span>day</span></span>
      </div>
      <div class="header-actions">
        <span class="wib-pill">WIB GMT+7</span>
      </div>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="main">

    <!-- Notification banner -->
    <div id="notif-banner" class="notif-banner" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
      <span>Get reminders before events start</span>
      <button class="btn-enable" onclick="requestNotifPermission()">Enable</button>
    </div>

    <!-- Sport filter chips -->
    <div class="filter-bar" id="sport-filters"></div>

    <!-- WC sub-filters -->
    <div id="wc-filter-section" class="sub-filter" style="display:none">
      <div class="sub-filter-label">World Cup 2026 — Filter</div>
      <div class="filter-bar" id="wc-filters"></div>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="Search events, fighters, teams…"
        autocomplete="off"
        spellcheck="false"
      >
    </div>

    <!-- Event count -->
    <div style="font-size:12px;color:var(--text3);margin-bottom:10px;font-family:var(--mono)">
      <span id="total-count">— events</span>
    </div>

    <!-- Event list -->
    <div id="event-list"></div>

    <!-- Bottom padding for FAB -->
    <div style="height:80px"></div>
  </main>

  <!-- ── FAB ── -->
  <button class="fab" id="open-add-btn" title="Add event">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

</div><!-- /.app -->

<!-- ── Overlay ── -->
<div id="overlay" class="overlay"></div>

<!-- ── Detail Drawer ── -->
<div id="detail-drawer" class="drawer">
  <div class="drawer-handle"></div>
  <div id="detail-content"></div>
</div>

<!-- ── Add Event Drawer ── -->
<div id="add-drawer" class="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title">Add event</div>

  <div class="field">
    <label>Title</label>
    <input type="text" id="f-title" placeholder="e.g. Arsenal vs Man City">
  </div>

  <div class="row-2">
    <div class="field">
      <label>Category</label>
      <select id="f-cat">
        <option value="football">⚽ Football</option>
        <option value="tennis">🎾 Tennis</option>
        <option value="swimming">🏊 Swimming</option>
        <option value="mma">🥊 MMA</option>
        <option value="boxing">🥊 Boxing</option>
        <option value="muaythai">🥋 Muay Thai</option>
        <option value="other">📅 Other</option>
      </select>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="f-status">
        <option value="upcoming">Upcoming</option>
        <option value="live">Live</option>
        <option value="finished">Finished</option>
      </select>
    </div>
  </div>

  <div class="row-2">
    <div class="field">
      <label>Date (WIB)</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label>Time (WIB)</label>
      <input type="time" id="f-time">
    </div>
  </div>

  <div class="field">
    <label>Venue / notes</label>
    <textarea id="f-notes" placeholder="Stadium, broadcaster, etc."></textarea>
  </div>

  <div style="display:flex;gap:10px;margin-top:4px">
    <button class="btn-action btn-secondary" style="flex:1" onclick="closeDrawers()">Cancel</button>
    <button class="btn-action btn-primary" id="save-event-btn" style="flex:2">Save event</button>
  </div>
</div>

<!-- ── Toast ── -->
<div id="toast" class="toast"></div>

<!-- ── Scripts ── -->
<script src="./js/data.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
